server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: vault-event-service
          uri: ${VAULT_EVENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/vault-events/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    io.micrometer.tracing: DEBUG
